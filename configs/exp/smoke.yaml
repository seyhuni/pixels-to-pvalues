# Tiny CPU/GPU smoke test (minutes). Not for results.
exp_name: smoke
data:
  crop_size: 256
  samples_per_epoch: 8
  folds: [0]
model:
  encoder: cnn:resnet18
  pretrained: false
  decoder_dim: 64
  detail_channels: [8, 16, 24, 32]
train:
  epochs: 1
  batch_size: 2
  num_workers: 0
  val_every: 1
  amp: none
infer:
  window: 512
  overlap: 0.25
  tta: false
  batch_size: 2
debug_max_images: 3
